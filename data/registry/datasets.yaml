# Where each dataset comes from and under which terms.
# The sha256 of every file is recorded in checksums.json on first download and verified afterwards.
# A dataset that needs a login can be placed by hand in data/raw/<name>/ under the listed filename.

datasets:
  welfake:
    license: CC BY 4.0
    homepage: https://zenodo.org/records/4561253
    files:
      - url: https://zenodo.org/records/4561253/files/WELFake_Dataset.csv?download=1
        filename: WELFake_Dataset.csv
    notes: >
      About 72k articles merged from four corpora (Kaggle, McIntire, Reuters, BuzzFeed Political).
      Overlaps ISOT. No publisher field. The label meaning is verified against the data by the
      loader's sanity check instead of trusted from the description.

  isot:
    license: Free for research use with attribution (see homepage)
    homepage: https://onlineacademiccommunity.uvic.ca/isot/2022/11/27/fake-news-detection-datasets/
    files:
      - url: https://onlineacademiccommunity.uvic.ca/isot/wp-content/uploads/sites/7295/2023/03/News-_dataset.zip
        filename: News_dataset.zip
    notes: >
      About 45k articles, 2016-2017. Every "true" article is from Reuters, so publisher artifacts
      must be scrubbed and the dataset must not dominate training.

  fakenewsnet:
    license: See repository (index files only; article bodies are not redistributed)
    homepage: https://github.com/KaiDMML/FakeNewsNet
    files:
      - url: https://raw.githubusercontent.com/KaiDMML/FakeNewsNet/master/dataset/politifact_fake.csv
        filename: politifact_fake.csv
      - url: https://raw.githubusercontent.com/KaiDMML/FakeNewsNet/master/dataset/politifact_real.csv
        filename: politifact_real.csv
      - url: https://raw.githubusercontent.com/KaiDMML/FakeNewsNet/master/dataset/gossipcop_fake.csv
        filename: gossipcop_fake.csv
      - url: https://raw.githubusercontent.com/KaiDMML/FakeNewsNet/master/dataset/gossipcop_real.csv
        filename: gossipcop_real.csv
    notes: >
      Headlines with source URLs, labelled by PolitiFact and GossipCop. Used as headline-length
      examples and for publisher-grouped splitting.

  liar:
    license: CC0 1.0 (LIAR-PLUS repository)
    homepage: https://github.com/Tariq60/LIAR-PLUS
    files:
      - url: https://raw.githubusercontent.com/Tariq60/LIAR-PLUS/master/dataset/tsv/train2.tsv
        filename: train2.tsv
      - url: https://raw.githubusercontent.com/Tariq60/LIAR-PLUS/master/dataset/tsv/val2.tsv
        filename: val2.tsv
      - url: https://raw.githubusercontent.com/Tariq60/LIAR-PLUS/master/dataset/tsv/test2.tsv
        filename: test2.tsv
    notes: >
      The 12.8k PolitiFact statements of LIAR (Wang, 2017), rated on six levels, 2007-2016, plus the
      fact-checkers' justifications added by LIAR-PLUS (Alhindi et al., 2018). The original LIAR zip
      on cs.ucsb.edu refuses scripted downloads (HTTP 403). The speaker "credit history" columns
      include each statement's own rating, so they are never used as features.

  # ---- Evaluation only. `role: external` and `role: satire` datasets have no entry in
  # ---- fnd_ml.data.loaders.LOADERS, so `fnd data build` can never put them into training data.

  constraint:
    role: external
    license: MIT (repository license)
    homepage: https://github.com/diptamath/covid_fake_news
    files:
      - url: https://raw.githubusercontent.com/diptamath/covid_fake_news/main/data/Constraint_Train.csv
        filename: Constraint_Train.csv
      - url: https://raw.githubusercontent.com/diptamath/covid_fake_news/main/data/Constraint_Val.csv
        filename: Constraint_Val.csv
      - url: https://raw.githubusercontent.com/diptamath/covid_fake_news/main/data/english_test_with_labels.csv
        filename: english_test_with_labels.csv
    notes: >
      Constraint@AAAI-2021 COVID-19 fake news (Patwa et al.): about 10.7k social media posts from
      2020 labelled real or fake. A different topic, period and text type from all training data.

  buzzfeed_webis:
    role: external
    license: CC BY 4.0
    homepage: https://zenodo.org/records/1239675
    files:
      - url: https://zenodo.org/records/1239675/files/articles.zip?download=1
        filename: articles.zip
    notes: >
      BuzzFeed-Webis Fake News Corpus 2016 (Potthast et al.): 1,627 articles from nine publishers
      in the week before the 2016 US election, each rated by BuzzFeed journalists.

  satire_headlines:
    role: satire
    license: No license file in the repository; cite Misra and Arora (2019), see homepage
    homepage: https://github.com/rishabhmisra/News-Headlines-Dataset-For-Sarcasm-Detection
    files:
      - url: https://raw.githubusercontent.com/rishabhmisra/News-Headlines-Dataset-For-Sarcasm-Detection/master/Sarcasm_Headlines_Dataset.json
        filename: Sarcasm_Headlines_Dataset.json
    notes: >
      About 26.7k headlines: The Onion (satire) and HuffPost (news). Trains the satire scorer only.
      Two publishers, so the score partly reflects their house styles.
