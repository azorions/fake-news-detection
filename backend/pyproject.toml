[project]
name = "fnd-api"
version = "0.1.0"
description = "FastAPI service for the fake news detector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fnd-ml",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "diskcache>=5.6",
    "redis>=5.2",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "lxml>=5.3",
    "tldextract>=5.1",
    "lingua-language-detector>=2.0",
    "python-ulid>=3.0",
    "anyio>=4.6",
]

[tool.uv.sources]
fnd-ml = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fnd_api"]
