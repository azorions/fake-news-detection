[project]
name = "fnd-ml"
version = "0.1.0"
description = "Data, training, inference and explainability for the fake news detector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml>=6",
    "typer>=0.12",
    "httpx>=0.27",
    "tldextract>=5.1",
]

[project.optional-dependencies]
train = ["torch==2.14.*"]

[project.scripts]
fnd = "fnd_ml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fnd_ml"]
