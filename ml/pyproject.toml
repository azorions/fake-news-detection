[project]
name = "fnd-ml"
version = "0.1.0"
description = "Data, training, inference and explainability for the fake news detector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml>=6",
    "typer>=0.12",
    "httpx>=0.27",
    "tldextract>=5.1",
    "psutil>=6",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# Comparison models and report plots. Nothing the API imports may need these.
classic = ["xgboost>=2.1", "matplotlib>=3.9"]
# Fine-tuning and export. PyTorch comes from the CUDA 12.6 index (see the root pyproject.toml).
train = [
    "fnd-ml[classic]",
    "torch==2.14.*",
    "transformers>=4.46",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "onnx>=1.17",
    "onnxscript>=0.1",
]

[project.scripts]
fnd = "fnd_ml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fnd_ml"]
